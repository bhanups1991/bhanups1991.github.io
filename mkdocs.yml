site_name: Bhanu Pratap Sharma, PhD
site_url: https://bhanups1991.github.io/
site_author: Bhanu Pratap Sharma

theme:
  name: material
  logo: images/logo.png

  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: custom-dark
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.sections
    - navigation.instant
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - About Me: about.md
  - Research Log:
    - Weak Form: weak_form.md
    - Tensors with Bases: tensors_with_bases.md
    # - Linearized Weak Form TL: linearized_weak_form_TL.md
    - Finite Element Method:
      # - Mind Map:
      #   - Quasi-Static Analysis: nonlinear_FE_mind_map_qs.md
      #   - Dynamic Analysis: nonlinear_FE_mind_map_dyn.md
      - Isoparametric Elements: isoparametric_elements.md
      - Geometric Nonlinearity: geometric_nonlinearity.md 
    - Signorini Conditions in Contact Mechanics: signorini_conditions.md
    - Piola Traction Decomposition: piola_traction_decomposition.md
    - Consistent Reminders: glossary.md
    - FAQs for Review: FAQs_review.md
    - Derivations and Proofs: derivations.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs
  - attr_list
  
plugins:
  - search
  - open-in-new-tab:
      add_icon: false

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/extra.js


extra_css:
  - javascripts/extra.css